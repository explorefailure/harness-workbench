name: Usage question
description: Ask a non-sensitive question about using Harness Workbench.
title: "[Question]: "
body:
  - type: markdown
    attributes:
      value: |
        Support is best effort. Search the documentation and existing issues first.
        Do not post secrets, private data, or security details; vulnerabilities use
        the private route in SECURITY.md.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you blocked?
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What you tried
      description: Link relevant documentation and include safe commands or output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Harness Workbench version or commit
      placeholder: hwb 0.1.0rc1 / abc1234
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and installation method when relevant.
      placeholder: Python 3.12.8 on macOS 15, installed from a wheel
  - type: checkboxes
    id: checks
    attributes:
      label: Public-report checks
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: This question contains no vulnerability details, secrets, or private data.
          required: true
