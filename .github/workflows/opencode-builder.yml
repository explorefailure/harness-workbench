name: OpenCode builder compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    name: OpenCode / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Create owned workspace and install pinned official runtime
        env:
          PYTHONPATH: src
        run: |
          python -m harness_workbench._opencode_cli init "$RUNNER_TEMP/opencode-builder"
          python "$RUNNER_TEMP/opencode-builder/install_runtime.py"
          echo "HWB_OPENCODE_BIN=$RUNNER_TEMP/opencode-builder/runtime/opencode" >> "$GITHUB_ENV"
      - name: Test native tools and independent outcome checks
        env:
          HWB_OPENCODE_LIVE_TEST: '1'
        run: python -m unittest discover -s tests -p test_opencode_builder.py -v
