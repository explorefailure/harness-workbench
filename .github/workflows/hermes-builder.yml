name: Hermes builder compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    name: Hermes / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional pinned runtime tool
        run: python -m pip install 'uv==0.12.21'
      - name: Initialize owned workspace and frozen Hermes source/runtime
        env:
          PYTHONPATH: src
        run: |
          python -m harness_workbench._hermes_cli init "$RUNNER_TEMP/hermes-builder"
          python "$RUNNER_TEMP/hermes-builder/install_runtime.py"
          echo "HWB_HERMES_RUNTIME=$RUNNER_TEMP/hermes-builder/runtime/source" >> "$GITHUB_ENV"
      - name: Test actual native tool stream and independent outcomes
        env:
          HWB_HERMES_LIVE_TEST: '1'
        run: python -m unittest discover -s tests -p test_hermes_builder.py -v
      - name: Test authenticated provider connections and independent checks
        env:
          HWB_HERMES_PROVIDER_TEST: '1'
          HWB_PROVIDER_HERMES: ${{ env.HWB_HERMES_RUNTIME }}
        run: python -m unittest discover -s tests -p test_provider_connections.py -v
      - name: Test native provider API protocols
        env:
          HWB_HERMES_NATIVE_PROTOCOL_TEST: '1'
          HWB_PROVIDER_HERMES: ${{ env.HWB_HERMES_RUNTIME }}
        run: python -m unittest discover -s tests -p test_provider_protocols.py -v
