- id: session-persistence-jsonl
  config:
    root: !!js process.env.DSH_HOME + '/sessions'
    compression: none
    packChunks: false

- id: agent-default-model
  config:
    provider: workbench-ollama
    model: qwen3.5:9b

- id: llm-pi-ai
  config:
    providers:
      workbench-ollama:
        displayName: Workbench Ollama
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        apiKeyEnv: HWB_OLLAMA_KEY
        reasoning: off
        compat:
          supportsReasoningEffort: true
        models:
          - id: qwen3.5:9b
            name: Qwen 3.5 9B
            contextWindow: 262144
            maxTokens: 8192
            reasoningEfforts:
              off: none
              high: high

- id: session-title-llm
  disabled: true

- id: system-prompt
  config:
    includeRuntimeContext: false

- id: approval
  config:
    policy: never

- id: permission
  config:
    defaultPreset: workbench
    presets:
      workbench:
        sandbox: workspace-write
        approval: never
        name: workbench
        description: Confined noninteractive experiment workspace.

- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: true
