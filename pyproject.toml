[build-system]
# 77, not 64: support for PEP 639 SPDX expressions and project.license-files
# landed in setuptools 77. The backend floor must implement the metadata this
# file declares; 77 also retains the PEP 660 editable-install support that
# originally established the lower bound.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-workbench"
dynamic = ["version"]
description = "Explore Failure's Harness Workbench — a workbench for building and testing harness ideas"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Copyright is held by the individual. "Explore Failure" is a research
# and project identity, not a legal entity -- see NOTICE.
authors = [{ name = "Garrett Davis" }]
maintainers = [{ name = "Garrett Davis" }]
keywords = [
    "harness",
    "reproducibility",
    "test-harness",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# The exact release toolchain, including the build backend. `requires` above is
# a floor, and `python -m build` resolves a floor freshly in an isolated
# environment, so the same commit built minutes apart produced different wheel
# bytes and different member modes under setuptools 79.0.1 and 84.0.0 -- 84
# drops the executable bit from `.py` package data that the source tree marks
# executable. The release gate therefore builds with `--no-isolation` against
# this pin. Third parties building from source are still governed by the floor;
# only the release path is pinned. `RELEASING.md` writes these versions
# literally and a test asserts the two lists agree.
release = [
    "build==1.6.0",
    "setuptools==83.0.0",
    "twine==7.0.0",
]

[project.urls]
Homepage = "https://github.com/explorefailure/harness-workbench"
Repository = "https://github.com/explorefailure/harness-workbench"
Issues = "https://github.com/explorefailure/harness-workbench/issues"

[project.scripts]
hwb = "harness_workbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
# The builtin feature tree ships with the package so `pip install harness-workbench` gives
# a tool that can demonstrate itself. It is OPT-IN via
# `"features_root": "harness_workbench:builtin"`, never a fallback -- see
# features.py.
include-package-data = true

[tool.setuptools.package-data]
# The subject tree ships for the same reason the builtin features do: so an
# install can demonstrate itself against real harnesses. It is DATA, never
# imported -- `hwb subjects init` copies it into a directory the user owns,
# where each spec's `inputs` digest covers the exact adapter bytes that ran.
harness_workbench = [
    "builtin/*/*.py",
    "builtin/*/FEATURE.json",
    "subjects/*.py",
    "subjects/*.json",
    "subjects/*.md",
    "subjects/*.sh",
    "subjects/*.yml",
    "subjects/*.yaml",
    # The interceptors are not Python and were not shipping. `guard_extension.ts`
    # (Pi) has been in the tree and absent from every built wheel, because this
    # list enumerated the languages the tree happened to contain when it was
    # written. `subject_files()` walks the SOURCE checkout, so nothing here
    # noticed. A test now asserts every file in the tree is matched by one of
    # these globs, which is the only version of this rule that cannot rot.
    "subjects/*.ts",
    "subjects/*.mjs",
    # Materialized trees are independent Git workspaces. Keep interrupted
    # per-run roots (including copied Codex auth) unstageable there too.
    "subjects/.gitignore",
    # The certification workflow must keep its retained-evidence scan usable
    # after `hwb subjects --into`, outside a source checkout.
    "subjects/.gitleaks.toml",
    "subjects/repair_fixture/*.py",
    "subjects/replay_fixtures/*.json",
]

[tool.setuptools.dynamic]
# A literal assignment lets setuptools read the value without importing the
# package. Source, wheel, and sdist therefore share one version declaration
# without adding a runtime dependency.
version = { attr = "harness_workbench.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
